<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>圣樱控制台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"Microsoft YaHei",sans-serif;background:#fff;color:#333;}
.bar{display:flex;align-items:center;gap:6px;padding:6px 8px;background:linear-gradient(90deg,#ffeef5,#fff5ee);border:1px solid #ffc1d4;border-radius:8px;flex-wrap:wrap;}
.logo{font-weight:700;color:#e05a86;font-size:13px;margin-right:4px;}
.bar button{border:1px solid #ffb3c9;background:#fff;color:#c9456f;border-radius:6px;padding:4px 9px;font-size:12px;cursor:pointer;}
.bar button:hover{background:#ffe0ec;}
.mode{display:flex;align-items:center;gap:3px;font-size:11px;color:#888;margin-left:auto;}
.panel{display:none;border:1px solid #ffc1d4;border-top:none;border-radius:0 0 8px 8px;padding:10px;background:#fffafc;}
.panel.open{display:block;}
.panel label{display:block;font-size:12px;color:#555;margin:6px 0 2px;}
.panel input,.panel select{width:100%;padding:5px 7px;border:1px solid #ffc1d4;border-radius:5px;font-size:12px;background:#fff;}
.ctrl-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0;}
.ctrl-row span{font-size:12px;color:#444;}
.ctrl-row input[type=checkbox]{width:auto;transform:scale(1.1);}
.go{margin-top:9px;background:linear-gradient(90deg,#e05a86,#ff8fb0);color:#fff;border:none;border-radius:6px;padding:6px 0;width:100%;font-size:13px;font-weight:600;cursor:pointer;}
.hint{font-size:10px;color:#bbb;margin-top:5px;text-align:center;}
</style>
</head>
<body>

<div class="bar">
  <span class="logo">🌸圣樱</span>
  <button data-p="rule">校规</button>
  <button data-p="priv">私发</button>
  <button data-p="ctrl">操控</button>
  <button data-p="act">活动</button>
  <button data-p="list">名单</button>
  <label class="mode"><input type="checkbox" id="toInput">先填输入框</label>
</div>

<div class="panel" id="p-rule">
  <label>校规名称</label><input id="rname" placeholder="如：午休不许出教室">
  <label>校规内容</label><input id="rcontent" placeholder="详细规则内容">
  <button class="go" onclick="doRule()">发布校规</button>
</div>

<div class="panel" id="p-priv">
  <label>发给谁</label><input id="ptarget" placeholder="如：苏小桃">
  <label>私发内容</label><input id="pcontent" placeholder="只有对方手机收到">
  <button class="go" onclick="doPriv()">私发</button>
</div>

<div class="panel" id="p-ctrl">
  <label>操控对象</label><input id="ctarget" placeholder="如：苏小桃">
  <div class="ctrl-row"><span>阴道·流水</span><input type="checkbox" id="c1"><span>阴蒂·快感</span><input type="checkbox" id="c2"><span>阴唇·瘙痒</span><input type="checkbox" id="c3"><span>膀胱·漏尿</span><input type="checkbox" id="c4"><span>乳头·摩擦即快感</span><input type="checkbox" id="c5"></div>
  <button class="go" onclick="doCtrl()">应用操控</button>
</div>

<div class="panel" id="p-act">
  <label>活动名称</label><input id="aname" placeholder="如：海边定情夏祭">
  <label>时间 / 地点</label><input id="atime" placeholder="如：本周六下午 / 圣樱学生街">
  <button class="go" onclick="doAct()">开启活动</button>
</div>

<div class="panel" id="p-list">
  <button class="go" onclick="doList()">查看名单 / 状态</button>
</div>

<div class="hint">发布的内容即来自圣樱控制台，后续可在剧情里自然展开</div>

<script>
function apiOk(){ return typeof createChatMessages==='function' && typeof triggerSlash==='function'; }

function send(txt){
  var toI=document.getElementById('toInput')&&document.getElementById('toInput').checked;
  if(!apiOk()){ alert('酒馆助手未就绪'); return false; }
  if(toI){
    triggerSlash('/setinput '+txt);
    return true;
  }
  createChatMessages([{role:'user',name:'樊麒',message:txt}]).then(function(){ triggerSlash('/trigger'); });
  return true;
}

function closePanels(){ document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('open');}); }
function toggle(p){ var el=document.getElementById(p); if(el.classList.contains('open')){el.classList.remove('open');}else{closePanels();el.classList.add('open');} }
document.querySelectorAll('.bar button[data-p]').forEach(function(b){ b.addEventListener('click',function(){ toggle('p-'+b.getAttribute('data-p')); }); });

function doRule(){
  var n=document.getElementById('rname').value.trim();
  var c=document.getElementById('rcontent').value.trim();
  if(!n||!c){ alert('请填写校规名称和内容'); return; }
  send('（樊麒在圣樱控制台上发布了一条校规）校规标题：'+n+'｜校规内容：'+c+'。这条校规现已以校董会名义全校生效，校园公告、广播、学生手册同步更新。');
}
function doPriv(){
  var t=document.getElementById('ptarget').value.trim();
  var c=document.getElementById('pcontent').value.trim();
  if(!t||!c){ alert('请填写对象和内容'); return; }
  send('（樊麒给'+t+'的手机私发了一条消息）内容：'+c+'。这条消息只有'+t+'一个人收到，其他人对此毫不知情。');
}
/* 操控：按玩家设计的身体敏感部位开关，对应 stat_data['操控状态'][对象][部位]=true */
function doCtrl(){
  var obj=document.getElementById('ctarget').value.trim();
  if(!obj){ alert('请填写操控对象'); return; }
  var parts=['阴道','阴蒂','阴唇','膀胱','乳头'];
  var on=[];
  for(var i=0;i<5;i++){ var cb=document.getElementById('c'+(i+1)); if(cb&&cb.checked){ on.push(parts[i]); } }
  if(on.length===0){ alert('请至少勾选一个部位'); return; }
  send('（樊麒通过圣樱控制台，对'+obj+'施加身体操控）开启的部位：'+on.join('、')+'。请据此更新 stat_data 的角色操控状态（对应部位置为开启），并描写'+obj+'身体出现相应反应：阴道持续流水／阴蒂持续快感／阴唇持续瘙痒／膀胱缓慢漏尿／乳头衣物摩擦即快感。');
}
function doAct(){
  var n=document.getElementById('aname').value.trim();
  var t=document.getElementById('atime').value.trim();
  if(!n){ alert('请填写活动名称'); return; }
  send('（樊麒在圣樱控制台上开启了一个校园活动）活动：'+n+'｜时间地点：'+(t||'未定')+'。已通过校园广播全校通知。');
}
function doList(){
  send('（樊麒打开圣樱控制台查看名单/状态）请以控制台的视角，列出当前已认识、已入册的女生名单，以及她们各自当前的大致状态。');
}
</script>
</body>
</html>
