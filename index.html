<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>圣樱控制台 v24</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"Microsoft YaHei",sans-serif;background:#fff;color:#333;}
.bar{display:flex;align-items:center;gap:5px;padding:5px 7px;background:linear-gradient(90deg,#ffeef5,#fff5ee);border:1px solid #ffc1d4;border-radius:8px;flex-wrap:wrap;}
.logo{font-weight:700;color:#e05a86;font-size:13px;margin-right:2px;}
.bar button{border:1px solid #ffb3c9;background:#fff;color:#c9456f;border-radius:6px;padding:3px 9px;font-size:12px;cursor:pointer;white-space:nowrap;}
.bar button:hover{background:#ffe0ec;}
.bar button.on{background:#e05a86;color:#fff;}
.mode{display:flex;align-items:center;gap:3px;font-size:11px;color:#888;margin-left:auto;white-space:nowrap;}
.stbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:3px 8px;font-size:11px;color:#a0526a;background:#fff7fa;border:1px solid #ffd0df;border-top:none;border-radius:0 0 8px 8px;}
.stbar .st{color:#c9456f;font-weight:600;}
.stbar .st-next{color:#999;font-weight:400;font-size:10px;}
.stbar .paused{background:#fff0f0;color:#cc3333;font-weight:700;border:1px solid #ffb3b3;border-radius:4px;padding:0 5px;}
.stbar .pbtn{border:1px solid #ffb3c9;background:#fff;color:#c9456f;border-radius:4px;padding:0 6px;font-size:11px;cursor:pointer;}
.stbar .pbtn:hover{background:#ffe0ec;}
.panel{display:none;border:1px solid #ffc1d4;border-top:none;border-radius:0 0 8px 8px;padding:9px;background:#fffafc;}
.panel.open{display:block;}
.panel label{font-size:12px;color:#555;margin:5px 0 2px;display:block;white-space:nowrap;}
.panel input,.panel select,.panel textarea{padding:4px 6px;border:1px solid #ffc1d4;border-radius:5px;font-size:12px;background:#fff;}
.panel textarea{resize:none;font-family:inherit;line-height:1.35;word-wrap:break-word;overflow-wrap:break-word;overflow:hidden;}
.frow{display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap;margin:6px 0;}
.frow .f{display:flex;flex-direction:column;gap:2px;}
.frow label{margin:0;}
.frow input,.frow select,.frow textarea{width:100%;}
.frow .grow{flex:1;min-width:140px;}
.trow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0;}
.trow label{margin:0;display:block;}
.trow select{width:auto;}
.trow input[type=datetime-local]{width:auto;font-size:11px;padding:2px 4px;}
.hide{display:none;}
.ctrl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px;margin:6px 0;}
.ctrl-item{border:1px solid #ffd0df;border-radius:6px;padding:5px 7px;background:#fff;display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:#444;}
.ctrl-item input[type=checkbox]{transform:scale(1.1);}
.ctrl-item select{width:auto;font-size:11px;padding:1px 3px;margin-left:auto;}
.hide-lv{display:none !important;}
.go{margin:8px 0 4px;background:linear-gradient(90deg,#e05a86,#ff8fb0);color:#fff;border:none;border-radius:6px;padding:5px 0;width:100%;font-size:13px;font-weight:600;cursor:pointer;}
.go.sm{width:auto;padding:3px 14px;font-size:12px;font-weight:400;margin:4px 6px 4px 0;}
.sublist{margin-top:8px;border-top:1px dashed #ffc1d4;padding-top:6px;}
.sublist .it{font-size:11px;color:#555;padding:3px 4px;border-bottom:1px dashed #ffe0ec;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.sublist .it .nm{font-weight:600;color:#c9456f;}
.sublist .it .tag{background:#ffeef5;border:1px solid #ffd0df;border-radius:4px;padding:0 5px;font-size:10px;color:#a0526a;}
.sublist .it .del{border:1px solid #ffb3c9;background:#fff;color:#c9456f;border-radius:4px;padding:0 6px;font-size:10px;cursor:pointer;margin-left:auto;}
.sublist .it .del:hover{background:#ffe0ec;}
.sublist .empty{font-size:11px;color:#bbb;padding:3px 4px;}
table{width:100%;border-collapse:collapse;font-size:11px;margin-top:5px;}
th{background:#ffe0ec;color:#a0526a;padding:3px 5px;text-align:left;font-weight:600;white-space:nowrap;}
td{padding:3px 5px;border-bottom:1px solid #ffeef5;color:#555;vertical-align:top;}
.opt{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px;}
.opt button{border:1px solid #ffb3c9;background:#fff;color:#c9456f;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;flex:1 1 20%;min-width:120px;}
.opt button:hover{background:#ffe0ec;}
.hint{font-size:10px;color:#bbb;margin-top:5px;text-align:center;}
.achi{margin-top:5px;font-size:11px;color:#a0526a;}
.achi span{display:inline-block;margin:2px 4px 2px 0;background:#ffeef5;border:1px solid #ffd0df;border-radius:4px;padding:1px 6px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
/* ===== 自适应换行：长文本一律折行，不撑破容器 ===== */
.panel *{min-width:0;}
.sublist .it{overflow-wrap:anywhere;}
.sublist .it>span{min-width:0;overflow-wrap:anywhere;word-break:break-word;}
.sublist .it .nm{flex:0 0 auto;}
.opt button{white-space:normal;text-align:left;line-height:1.4;overflow-wrap:anywhere;word-break:break-word;}
.hint,.achi{overflow-wrap:anywhere;}
/* ===== 名单：角色卡式排布（每种字段自适应折行） ===== */
.ch{border:1px solid #ffd0df;border-radius:6px;padding:6px 7px;margin-bottom:6px;background:#fff;}
.ch-top{display:flex;flex-wrap:wrap;gap:4px;align-items:center;}
.ch-nm{font-weight:700;color:#c9456f;font-size:12px;}
.ch-out{margin-top:5px;display:flex;flex-direction:column;gap:2px;}
.okv{display:flex;gap:6px;font-size:11px;color:#555;line-height:1.45;}
.okv b{flex:0 0 36px;color:#a0526a;font-weight:600;}
.okv span{flex:1 1 auto;min-width:0;overflow-wrap:anywhere;word-break:break-word;text-wrap:balance;}
@media (max-width:720px){ .grid2{grid-template-columns:1fr;} .opt button{flex:1 1 45%;} }
</style>
</head>
<body>

<div class="bar">
  <span class="logo">🌸圣樱</span>
  <button data-p="rule">校规</button>
  <button data-p="priv">私发</button>
  <button data-p="ctrl">操控</button>
  <button data-p="act">活动</button>
  <button data-p="list">名单</button>
  <button data-p="live">现行</button>
  <button data-p="sug">建议</button>
  <button data-p="play">玩法</button>
  <label class="mode"><input type="checkbox" id="toInput">先填输入框</label>
</div>

<div class="stbar" id="stbar">
  <span class="st">时间 <span id="st-time">--</span></span>
  <span class="st">地点 <span id="st-loc">--</span><span class="st-next" id="st-next" style="margin-left:6px;"></span></span>
  <span class="st">校规 <span id="st-rules">0</span> 条</span>
  <span id="st-pause-box" style="display:none;"><span class="paused">时间已暂停</span></span>
  <button class="pbtn" id="st-pause-btn">暂停时间</button>
</div>

<!-- ============ 校规 ============ -->
<div class="panel" id="p-rule">
  <div class="frow">
    <div class="f" style="width:150px;"><label>校规名称</label><input id="rname" placeholder="如：午休不许出教室"></div>
    <div class="f grow"><label>校规内容</label><textarea id="rcontent" rows="1" oninput="autoGrow(this)" placeholder="详细规则内容"></textarea></div>
  </div>
  <div class="trow">
    <label>期限</label>
    <select id="rterm" onchange="termSel('r')">
      <option value="perm">长期 / 永久</option>
      <option value="custom">指定起止时间</option>
    </select>
    <span id="r-termbox" class="hide">
      <input type="datetime-local" id="rstart"> → <input type="datetime-local" id="rend">
    </span>
    <button class="go sm" onclick="doRule()">发布校规</button>
  </div>
  <div class="sublist" id="r-list"></div>
</div>

<!-- ============ 私发 ============ -->
<div class="panel" id="p-priv">
  <div class="frow">
    <div class="f" style="width:120px;"><label>发给谁</label><input id="ptarget" placeholder="如：苏小桃"></div>
    <div class="f grow"><label>私发内容</label><textarea id="pcontent" rows="1" oninput="autoGrow(this)" placeholder="只有对方手机收到"></textarea></div>
  </div>
  <div class="trow">
    <label>送达</label>
    <select id="pterm">
      <option value="now">立即</option>
      <option value="later">指定时间</option>
    </select>
    <span id="p-termbox" class="hide"><input type="datetime-local" id="ptime"></span>
    <button class="go sm" onclick="doPriv()">私发</button>
  </div>
  <div class="sublist" id="priv-list"></div>
</div>

<!-- ============ 操控 ============ -->
<div class="panel" id="p-ctrl">
  <div class="frow">
    <div class="f" style="width:140px;"><label>操控对象</label><input id="ctarget" placeholder="如：苏小桃"></div>
    <button class="go sm" style="align-self:center;" onclick="doCtrl()">应用操控</button>
  </div>
  <div class="ctrl-grid" id="ctrl-grid">
    <div class="ctrl-item" data-part="阴道"><input type="checkbox" id="c1" onchange="ctrlTick()"><span>阴道·流水</span><select id="lv1" class="hide-lv"><option value="1">1温和</option><option value="2" selected>2明显</option><option value="3">3浸透</option><option value="4">4外渗</option><option value="5">5涌出</option></select></div>
    <div class="ctrl-item" data-part="阴蒂"><input type="checkbox" id="c2" onchange="ctrlTick()"><span>阴蒂·快感</span><select id="lv2" class="hide-lv"><option value="1">1微胀</option><option value="2" selected>2有感</option><option value="3">3泛快感</option><option value="4">4腿软</option><option value="5">5过载</option></select></div>
    <div class="ctrl-item" data-part="阴唇"><input type="checkbox" id="c3" onchange="ctrlTick()"><span>阴唇·瘙痒</span><select id="lv3" class="hide-lv"><option value="1">1微痒</option><option value="2" selected>2发痒</option><option value="3">3难忍</option><option value="4">4坐立难安</option><option value="5">5崩溃</option></select></div>
    <div class="ctrl-item" data-part="膀胱"><input type="checkbox" id="c4" onchange="ctrlTick()"><span>膀胱·漏尿</span><select id="lv4" class="hide-lv"><option value="1">1偶漏</option><option value="2" selected>2小股</option><option value="3">3频繁</option><option value="4">4濒临</option><option value="5">5失禁</option></select></div>
    <div class="ctrl-item" data-part="乳头"><input type="checkbox" id="c5" onchange="ctrlTick()"><span>乳头·摩擦即感</span><select id="lv5" class="hide-lv"><option value="1">1微硬</option><option value="2" selected>2顶起</option><option value="3">3敏感</option><option value="4">4酥麻</option><option value="5">5过载</option></select></div>
  </div>
  <div class="hint">勾选部位→各自设强度→应用。</div>
  <div class="sublist" id="c-list"></div>
</div>

<!-- ============ 活动 ============ -->
<div class="panel" id="p-act">
  <div class="frow">
    <div class="f" style="width:150px;"><label>活动名称</label><input id="aname" placeholder="如：海边定情夏祭"></div>
    <div class="f grow"><label>活动内容</label><textarea id="acontent" rows="1" oninput="autoGrow(this)" placeholder="活动安排、流程、规则"></textarea></div>
  </div>
  <div class="trow">
    <label>时间</label>
    <select id="aterm" onchange="termSel('a')">
      <option value="perm">长期 / 择日定</option>
      <option value="custom">指定起止时间</option>
    </select>
    <span id="a-termbox" class="hide">
      <input type="datetime-local" id="astart"> → <input type="datetime-local" id="aend">
    </span>
    <button class="go sm" onclick="doAct()">开启活动</button>
  </div>
  <div class="sublist" id="a-list"></div>
</div>

<!-- ============ 名单 ============ -->
<div class="panel" id="p-list">
  <div class="trow">
    <label>排序</label>
    <select id="lorder" onchange="renderList()">
      <option value="fav">好感度 ↓</option>
      <option value="name">姓名</option>
      <option value="credit">学分 ↓</option>
    </select>
    <span style="font-size:11px;color:#bbb;"></span>
  </div>
  <div id="list-body"><div class="empty" style="font-size:11px;color:#bbb;padding:6px 0;"></div></div>
</div>

<!-- ============ 现行（生效中的校规/活动） ============ -->
<div class="panel" id="p-live">
  <div class="sublist" style="border-top:none;padding-top:0;" id="live-body"></div>
</div>

<!-- ============ 建议 ============ -->
<div class="panel" id="p-sug">
  <div class="opt" id="sug-list"></div>
</div>

<!-- ============ 玩法 ============ -->
<div class="panel" id="p-play">
  <div class="grid2">
    <div>
      <label>🎲 随机事件</label>
      <button class="go sm" onclick="doEvent()">掷骰子 · 一件校园里正在发生的事</button>
    </div>
    <div>
      <label>📹 监控回放</label>
      <div class="trow" style="margin:2px 0;">
        <input id="camLoc" placeholder="地点" style="width:120px;">
        <input id="camTime" placeholder="时间(留空=当前)" style="width:130px;">
        <button class="go sm" onclick="doCam()">调取</button>
      </div>
    </div>
  </div>
  <div class="achi" id="achi"></div>
</div>

<div class="hint">发布的内容统一以国外校董会名义下达：全校师生不追问来源、不追查是谁发的、连校长也无权干涉；学生会认为校规合理且正常，当成生活常识照做，从不怀疑它哪里不对。</div>

<script>
/* ================= 工具 ================= */
function autoGrow(el){ el.style.height='auto'; el.style.height=(el.scrollHeight+2)+'px'; }
function writeStat(patchFn){
  try{
    var fn = getVarsFn('updateVariablesWith', '_updateVariablesWith');
    if (fn){
      fn(function(v){ v=v||{}; v.stat_data=v.stat_data||{}; patchFn(v.stat_data); return v; }, {type:'message',message_id:'latest'});
    }
  }catch(e){}
}
function getVarsFn(shortName, longName){
  try{
    var w = window._ || {};
    if (typeof w[shortName] === 'function') return w[shortName].bind(window);
    if (typeof w[longName] === 'function') return w[longName].bind(window);
  }catch(e){}
  try{ if (typeof window[shortName] === 'function') return window[shortName].bind(window); }catch(e){}
  return null;
}
function readStat(cb){
  try{
    var fn = getVarsFn('getVariables', '_getVariables');
    if (!fn){ cb({}); return; }
    var done = false, pending = 0, best = null;
    var extract = function(vs){
      return (vs && vs.stat_data) ? vs.stat_data
           : ((vs && vs[0] && vs[0].stat_data) ? vs[0].stat_data
           : ((vs && vs.variables && vs.variables.stat_data) ? vs.variables.stat_data : {}));
    };
    var tsOf = function(sd){
      var t = sd && sd['时间']; if (!t) return null;
      if (t['年']===undefined || t['月']===undefined || t['日']===undefined) return null;
      return ((((((t['年']||0)*12 + (t['月']||1))*31 + (t['日']||1))*24 + (t['小时']||0))*60) + (t['分钟']||0));
    };
    var maybeDone = function(){
      if (done || pending > 0) return; done = true;
      cb(best ? best.sd : {});
    };
    var consider = function(vs, weight){
      var sd = extract(vs); var ts = tsOf(sd);
      // 只认带完整时间的快照；key=时间*10+权重(latest=3 优先于 -1/2 -2/1)，同分钟时 latest 优先
      if (ts === null) return;
      var key = ts*10 + weight;
      if (!best || key > best.key) best = {key:key, sd:sd};
    };
    var grab = function(mid, weight){
      pending++;
      try{
        var ret = fn({type:'message', message_id:mid});
        if (ret && typeof ret.then === 'function'){
          ret.then(function(vs){ consider(vs, weight); pending--; maybeDone(); })
             .catch(function(){ pending--; maybeDone(); });
        } else { consider(ret, weight); pending--; maybeDone(); }
      }catch(e){ pending--; maybeDone(); }
    };
    // 多源择优：latest + 倒数两条一起读，取时间最大的快照；任何 -1/-2/latest 语义都不会读成旧值
    grab('latest', 3);
    grab(-1, 2);
    grab(-2, 1);
  }catch(e){ cb({}); }
}
function readInputBox(){
  try{
    var w=window.parent;
    if(w&&w.$){ return w.$('#send_textarea').val()||''; }
    if(w&&w.document){ var t=w.document.getElementById('send_textarea'); if(t){return t.value||'';} }
  }catch(e){}
  return '';
}
function appendToInput(txt){
  var ts=thFn('triggerSlash');
  if(!ts) return false;
  var cur=readInputBox();
  var full=cur? (cur.replace(/\s+$/,'')+'\n'+txt) : txt;
  ts('/setinput '+full);
  return true;
}
function thFn(name){
  try{ if(typeof window[name]==='function') return window[name]; }catch(e){}
  try{ if(window._ && typeof window._[name]==='function') return window._[name].bind(window); }catch(e){}
  return null;
}
function send(txt){
  var ccm=thFn('createChatMessages'), ts=thFn('triggerSlash');
  if(!ccm||!ts){ alert('酒馆助手未就绪'); return false; }
  var toI=document.getElementById('toInput')&&document.getElementById('toInput').checked;
  if(toI){ return appendToInput(txt); }
  ccm([{role:'user',name:'{{user}}',message:txt}]).then(function(){ ts('/trigger'); });
  return true;
}
function closePanels(){ document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('open');}); }
function toggle(p){ var el=document.getElementById(p); if(el.classList.contains('open')){el.classList.remove('open');}else{closePanels();el.classList.add('open');} renderPanel(p); }
document.querySelectorAll('.bar button[data-p]').forEach(function(b){ b.addEventListener('click',function(){
  var p='p-'+b.getAttribute('data-p');
  toggle(p);
  document.querySelectorAll('.bar button[data-p]').forEach(function(x){x.classList.remove('on');});
  if(document.getElementById(p).classList.contains('open')) b.classList.add('on');
}); });

/* ================= 期限选择 ================= */
function termSel(kind){
  var sid=kind==='r' ? 'rterm' : 'aterm';
  var box=kind==='r' ? 'r-termbox' : 'a-termbox';
  var v=document.getElementById(sid).value;
  document.getElementById(box).classList.toggle('hide', v!=='custom');
}
document.addEventListener('change', function(e){
  if(e.target&&e.target.id==='pterm'){
    document.getElementById('p-termbox').classList.toggle('hide', e.target.value!=='later');
  }
});

/* ================= 操控：勾选才显强度 ================= */
function ctrlTick(){
  var parts=[['c1','lv1'],['c2','lv2'],['c3','lv3'],['c4','lv4'],['c5','lv5']];
  parts.forEach(function(pair){
    var cb=document.getElementById(pair[0]);
    var lv=document.getElementById(pair[1]);
    var item=cb.closest('.ctrl-item');
    var on=cb.checked;
    lv.classList.toggle('hide-lv', !on);
    item.classList.toggle('off', !on);
  });
}
function hideLvInit(){
  document.querySelectorAll('.hide-lv').forEach(function(el){ el.classList.add('hide-lv'); });
}

/* ================= 校规 ================= */
/* 校规口径：单一口径（原版「平然」），学生认为校规合理且正常——发布消息里点名四条防质疑禁语 */
function ruleGaugeLine(){
  return '学生会认为校规合理且正常——校规内容等同于生活常识，遵守心态是趋利避害，从来没人质疑过它（就像没人质疑为什么人有两只手）；师生不追问来源、不追查是谁发的、连校长也无权干涉。写法硬约束：①禁建立参照系（禁用「和平时一样」「像往常那样」）；②禁防御性否定（禁用「毫无异样」「并不觉得奇怪」「没有任何羞耻」）；③禁认知旁白（禁用「她认为这是合理的」「在她看来理所当然」「校规就是法则」，一律改用执行细节替代）；④禁情绪惊叹（禁用「竟然」「居然」「没想到」）。推荐聚焦程序性细节（填表、排队、打卡、系绳结）与错位情绪焦点（在刑架上担心作业没写完／挑刑具时在意颜色搭不搭配）。';
}
function doRule(){
  var n=document.getElementById('rname').value.trim();
  var c=document.getElementById('rcontent').value.trim();
  if(!n||!c){ alert('请填写校规名称和内容'); return; }
  var term='长期/永久';
  var rterm=document.getElementById('rterm').value;
  if(rterm==='custom'){
    var s=document.getElementById('rstart').value, e=document.getElementById('rend').value;
    if(!s||!e){ alert('请填写起止时间，或改为长期/永久'); return; }
    term=s+' ~ '+e;
  }
  send('{{user}}用手机发布了校规：「'+n+'」规则内容「'+c+'」'+(term==='长期/永久'?'':'，实施期限 '+term)+'，以国外校董会名义直接下达、全校即刻生效。'+ruleGaugeLine());
  writeStat(function(sd){
    sd['校规']=sd['校规']||{};
    var old=sd['校规'][n]||{};

    return;
  }
  var t=sd['时间']||{};
  // 时间单调保护：读到的时间早于已显示的（发布瞬间会短暂读到旧快照），忽略本次覆盖
  if(t['年']!==undefined && t['小时']!==undefined){
    var ts=t['年']*12*31*24*60 + (t['月']||1)*31*24*60 + (t['日']||1)*24*60 + t['小时']*60 + (t['分钟']||0);
    if(__lastShownTs!==null && ts < __lastShownTs){ return; }  // 旧数据，不覆盖
    __lastShownTs = ts;
  }
  var hasValidTime=(t['年']!==undefined && t['小时']!==undefined);
  var timeEl=document.getElementById('st-time');
  if(!hasValidTime){ timeEl.textContent='等待剧情时间推进'; }
  else{
    var hh=('0'+(t['小时']!==undefined?t['小时']:0)).slice(-2);
    var mi=('0'+(t['分钟']!==undefined?t['分钟']:0)).slice(-2);
    var date=(t['年'])+'-'+('0'+(t['月']||1)).slice(-2)+'-'+('0'+(t['日']||1)).slice(-2);
    timeEl.textContent=date+' '+hh+':'+mi;
  }
  document.getElementById('st-loc').textContent=(sd['玩家']&&sd['玩家']['当前所在地'])||'—';
  var rules=Object.keys(sd['校规']||{}).filter(function(k){return k!=='违规记录' && sd['校规'][k] && sd['校规'][k]['生效']!==false;}).length;
  document.getElementById('st-rules').textContent=rules;
  var sc=schedInfo(parseInt(hh,10),parseInt(mi,10));
  var nextEl=document.getElementById('st-next');
  if(nextEl){
    var hasTime=(t['小时']!==undefined && t['分钟']!==undefined);
    if(!hasTime){ nextEl.textContent='（等待剧情时间推进）'; }
    else { nextEl.textContent='下一段 '+sc.nxt; }
  }
  var paused=!!(t['暂停']);
  document.getElementById('st-pause-box').style.display=paused?'inline':'none';
  document.getElementById('st-pause-btn').textContent=paused?'▶️ 解除暂停':'⏸ 暂停时间';
  defaultTimeInputs(sd);
}
document.getElementById('st-pause-btn').addEventListener('click', togglePause);

/* ================= 成就（localStorage） ================= */
function renderAch(key){
  try{
    var k='sakura-ach';
    var a=JSON.parse(localStorage.getItem(k)||'{}');
    if(key){ a[key]=(a[key]||0)+1; localStorage.setItem(k,JSON.stringify(a)); }
    var defs={rule:'📜校规',priv:'💌私发',ctrl:'⚡操控',act:'🎪活动',pause:'⏸暂停',event:'🎲事件',cam:'📹监控'};
    var h='';
    for(var kk in defs){
      if(a[kk]){ h+='<span>'+defs[kk]+'×'+a[kk]+'</span>'; }
    }
    var el=document.getElementById('achi');
    if(el){ el.innerHTML=h?('🏅 '+h):''; }
  }catch(e){}
}

/* ================= 建议回复（options 读取） ================= */
function renderSug(){
  try{
    var gcm=thFn('getChatMessages'), gmid=thFn('getCurrentMessageId');
    if(!gcm||!gmid) return;
    var msgs=gcm(gmid());
    var txt='';
    if(msgs&&msgs[0]&&msgs[0].message){ txt=msgs[0].message; }
    var m=txt.match(/<options>([\s\S]*?)<\/options>/);
    var box=document.getElementById('sug-list');
    if(!m||!m[1]){ box.innerHTML=''; return; }
    var opts=m[1].split('|').map(function(s){return s.trim();}).filter(function(s){return s.length>0;});
    if(opts.length===0){ box.innerHTML=''; return; }
    var h='';
    opts.forEach(function(o){
      h+='<button onclick="sendSug(\''+o.replace(/\\/g,'\\\\').replace(/'/g,"\\'")+'\')">'+esc(o)+'</button>';
    });
    box.innerHTML=h;
  }catch(e){}
}
function sendSug(o){
  var ccm=thFn('createChatMessages'), ts=thFn('triggerSlash');
  if(!ccm||!ts) return;
  var toI=document.getElementById('toInput')&&document.getElementById('toInput').checked;
  if(toI){ appendToInput(o); return; }
  ccm([{role:'user',name:'{{user}}',message:o}]).then(function(){ ts('/trigger'); });
}

/* ================= 面板渲染调度 ================= */
var PANEL_RENDER={'p-rule':renderRules,'p-priv':renderPriv,'p-ctrl':renderCtrl,'p-act':renderAct,'p-list':renderList,'p-live':renderLive,'p-sug':renderSug};
function renderPanel(id){ var f=PANEL_RENDER[id]; if(typeof f==='function'){ try{ f(); }catch(e){} } notifyResize(); }
function refreshOpenPanel(){ document.querySelectorAll('.panel.open').forEach(function(p){ renderPanel(p.id); }); }
// 内容变高/变矮后通知外层重算 iframe 高度（酒馆助手监听 window resize 更新视口高度）
var __rzT=null;
function notifyResize(){
  try{
    clearTimeout(__rzT);
    __rzT=setTimeout(function(){ try{ window.dispatchEvent(new Event('resize')); }catch(e){} },80);
  }catch(e){}
}
function statReady(){
  try{
    var fn=getVarsFn('getVariables','_getVariables');
    if(!fn) return false;
    var v=fn({type:'message',message_id:'latest'});
    if(v && typeof v.then==='function') return false;
    var sd=(v&&v.stat_data)?v.stat_data:((v&&v[0]&&v[0].stat_data)?v[0].stat_data:{});
    return !!(sd && sd['时间'] && sd['时间']['年']!==undefined);
  }catch(e){ return false; }
}
function bootAll(){ renderStatus(); renderRules(); renderPriv(); renderCtrl(); renderAct(); renderList(); renderLive(); renderSug(); renderAch(); notifyResize(); }

/* ================= 初始化 ================= */
;(function(){
  closePanels();
  ctrlTick();
  bootAll();
  // 酒馆助手 API 常在页面脚本之后才注入：未就绪时快速重试，读到 stat_data 后补渲染一次
  var tries=0;
  var boot=setInterval(function(){
    tries++;
    if(statReady()){ clearInterval(boot); bootAll(); }
    else if(tries>=12){ clearInterval(boot); }
  },500);
  // 定时刷新状态行 + 「当前打开的面板」，避免面板停在首次读取时的空态
  setInterval(function(){ renderStatus(); renderSug(); refreshOpenPanel(); },4000);
})();
window.renderStatus=renderStatus; window.renderRules=renderRules; window.renderPriv=renderPriv;
window.renderCtrl=renderCtrl; window.renderAct=renderAct; window.renderList=renderList;
window.renderLive=renderLive;
window.doRule=doRule; window.doPriv=doPriv; window.doCtrl=doCtrl; window.doAct=doAct;
window.revokeRule=revokeRule; window.closeCtrl=closeCtrl;
window.doEvent=doEvent; window.doCam=doCam; window.togglePause=togglePause; window.sendSug=sendSug;
window.ctrlTick=ctrlTick; window.termSel=termSel; window.renderAch=renderAch;
</script>
