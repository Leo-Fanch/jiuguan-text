<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>圣樱控制条</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:"PingFang SC","Microsoft YaHei",sans-serif; }
  body { background:transparent; }
  .bar{ display:flex; gap:6px; padding:6px; background:rgba(253,242,247,.95); border-radius:12px; box-shadow:0 1px 6px rgba(214,90,122,.18); align-items:center; }
  .b{ flex:1; border:none; background:#f7dce4; color:#b04766; font-size:13px; font-weight:bold; padding:9px 0; border-radius:9px; cursor:pointer; text-align:center; }
  .b.on{ background:#d65a7a; color:#fff; }
  .panel{ display:none; background:#fff; border-radius:12px; margin-top:6px; padding:12px; box-shadow:0 2px 8px rgba(214,90,122,.12); }
  .panel.show{ display:block; }
  label{ font-size:12px; color:#a06a78; display:block; margin:8px 0 4px; }
  input[type=text]{ width:100%; padding:8px 10px; border:1px solid #f0ccd6; border-radius:8px; font-size:14px; outline:none; }
  textarea{ width:100%; padding:8px 10px; border:1px solid #f0ccd6; border-radius:8px; font-size:13px; min-height:44px; outline:none; }
  .btn{ display:block; width:100%; padding:10px; border:none; border-radius:9px; font-size:14px; font-weight:bold; cursor:pointer; margin-top:8px; }
  .btn-pink{ background:#d65a7a; color:#fff; }
  .btn-soft{ background:#f7dce4; color:#b04766; }
  .btnrow{ display:flex; gap:7px; } .btnrow .btn{ flex:1; }
  .sw-row{ display:flex; align-items:center; justify-content:space-between; padding:6px 0; border-bottom:1px dashed #f6e3ea; }
  .sw-row:last-child{ border:none; }
  .sw-label{ font-size:13px; }
  .sw-desc{ font-size:10px; color:#b0838f; display:block; }
  .switch{ position:relative; width:42px; height:23px; }
  .switch input{ display:none; }
  .slider{ position:absolute; inset:0; background:#e5c4ce; border-radius:12px; transition:.2s; }
  .slider:before{ content:""; position:absolute; width:17px; height:17px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; }
  input:checked + .slider{ background:#d65a7a; }
  input:checked + .slider:before{ transform:translateX(19px); }
  .mini{ font-size:10px; color:#b0838f; margin-top:6px; }
</style>
</head>
<body>
<div class="bar">
  <button class="b" id="tb1" onclick="tog(1)">📜 校规</button>
  <button class="b" id="tb2" onclick="tog(2)">📮 私发</button>
  <button class="b" id="tb3" onclick="tog(3)">🎛 操控</button>
  <button class="b" id="tb4" onclick="tog(4)">🎪 活动</button>
  <button class="b" id="tb5" onclick="tog(5)">🗂 名单</button>
</div>

<div class="panel" id="p1">
  <label>发布校规·内容</label>
  <textarea id="rtext" placeholder="例：全校统一白丝"></textarea>
  <button class="btn btn-pink" onclick="doRule()">发布广播</button>
  <div class="mini">点按钮自动填入输入框，回车发送</div>
</div>

<div class="panel" id="p2">
  <label>发给对象</label>
  <input type="text" id="ptarget" placeholder="苏小桃 / 三年一班 / 戴眼镜的">
  <label>私发内容</label>
  <textarea id="ptext" placeholder="只有她手机收到、别人不知情的规则"></textarea>
  <button class="btn btn-soft" onclick="doPrivate()">📮 私发</button>
</div>

<div class="panel" id="p3">
  <label>操控对象 <span style="float:right;font-size:11px;color:#b0838f;" onclick="document.getElementById('p3').querySelector('input').value=''">清空</span></label>
  <input type="text" id="ctarget" placeholder="当前面对/在旁的女生">
  <div style="margin-top:6px;" id="ctlSwitches">
    <div class="sw-row"><span class="sw-label">阴道<span class="sw-desc">流水</span></span><label class="switch"><input type="checkbox" id="cv"><span class="slider"></span></label></div>
    <div class="sw-row"><span class="sw-label">阴蒂<span class="sw-desc">性快感</span></span><label class="switch"><input type="checkbox" id="cc"><span class="slider"></span></label></div>
    <div class="sw-row"><span class="sw-label">阴唇<span class="sw-desc">瘙痒</span></span><label class="switch"><input type="checkbox" id="cl"><span class="slider"></span></label></div>
    <div class="sw-row"><span class="sw-label">膀胱<span class="sw-desc">缓慢漏尿</span></span><label class="switch"><input type="checkbox" id="cb"><span class="slider"></span></label></div>
    <div class="sw-row"><span class="sw-label">乳头<span class="sw-desc">摩擦快感</span></span><label class="switch"><input type="checkbox" id="cn"><span class="slider"></span></label></div>
  </div>
  <button class="btn btn-pink" onclick="doControl()">▶ 写入操控状态</button>
</div>

<div class="panel" id="p4">
  <label>活动名称</label>
  <input type="text" id="aname" placeholder="补习 / 泳池日 / 茶会">
  <div class="btnrow">
    <div style="flex:1"><label>开始</label><input type="text" id="astart" placeholder="3月1日"></div>
    <div style="flex:1"><label>结束</label><input type="text" id="aend" placeholder="3月5日"></div>
  </div>
  <label>地点</label>
  <input type="text" id="aplace" placeholder="图书馆 / 操场 / 泳池">
  <label style="display:flex;align-items:center;gap:8px;margin-top:8px;">
    <input type="checkbox" id="ahost" style="width:auto;"><span>我是主理人（活动中我主导、说话主动权在我）</span>
  </label>
  <button class="btn btn-soft" onclick="doActivity()">🎪 发起活动</button>
</div>

<div class="panel" id="p5">
  <button class="btn btn-pink" onclick="doList()">🗂 列出已登场女生</button>
  <div class="mini">AI 实时汇报当前已登场的女生名单（活的，可用资料）</div>
</div>

<script>
function getTA(){ return document.querySelector('#send_textarea') || document.querySelector('.send_textarea textarea') || document.querySelector('textarea.send_textarea'); }
function inject(t){ var ta=getTA(); if(ta){ ta.value=t; ta.focus(); } else alert('未找到输入框：\n'+t); }
function tog(n){
  for(var i=1;i<=5;i++){
    var p=document.getElementById('p'+i), b=document.getElementById('tb'+i);
    var show = (i===n) && !p.classList.contains('show');
    p.classList.toggle('show', show);
    b.classList.toggle('on', show);
  }
}
function doRule(){ var c=document.getElementById('rtext').value.trim(); if(!c){alert('先填内容');return;} inject('通过校规管理APP，发布校规（广播全校）：'+c); }
function doPrivate(){ var t=document.getElementById('ptarget').value.trim()||'指定对象', c=document.getElementById('ptext').value.trim(); if(!c){alert('先填私发内容');return;} inject('通过校规管理APP，私发校规给【'+t+'】：'+c+'（仅推送到其手机，公告栏/广播不播，其他学生不知情，只对该对象生效）'); }
function doControl(){
  var t=document.getElementById('ctarget').value.trim(); if(!t){alert('先填操控对象');return;}
  var m=[['阴道',cv],['阴蒂',cc],['阴唇',cl],['膀胱',cb],['乳头',cn]];
  var on=[],off=[]; m.forEach(function(p){ p[1].checked?on.push(p[0]):off.push(p[0]); });
  inject('对【'+t+'】更新操控状态：'+(on.length?'开启：'+on.join('、')+'；':'全部关闭；')+'请记录进操控状态变量并据此演绎此后身体反应。');
}
function doActivity(){
  var a=document.getElementById('aname').value.trim(); if(!a){alert('先填活动名');return;}
  var s=document.getElementById('astart').value.trim(), e=document.getElementById('aend').value.trim(), p=document.getElementById('aplace').value.trim();
  var h=document.getElementById('ahost').checked?'，我是主理人（活动中由我主导，说话主动权在我）':'';
  inject('通过校规管理APP，举办活动：'+a+'；时间：'+(s||'?')+'-'+(e||'?')+'；地点：'+(p||'?')+h);
}
function doList(){ inject('🗂 请汇报当前已登场的女生名单（名字+身份）'); }
</script>
</body>
</html>
